<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理论力学 · 知识地图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1117; --bg2:#161b22; --bg3:#1c2230; --line:#2a3140;
  --fg:#e6edf3; --fg2:#9aa7b8; --fg3:#6e7d92;
  --acc:#2f6fed; --pur:#7c5cff; --grn:#00a86b; --org:#e8590c; --red:#e5484d; --yel:#d9a300;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
/* ---------- header ---------- */
header{
  padding:16px 22px;background:linear-gradient(100deg,#161b22 0%,#1a2338 55%,#20182e 100%);
  border-bottom:1px solid var(--line);flex:none;
}
.h1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:21px;font-weight:700;letter-spacing:.5px}
h1 .em{background:linear-gradient(92deg,#4d8bff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--fg2);margin-top:5px;line-height:1.6}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;color:var(--fg2)}
.stat b{color:var(--fg);font-size:13.5px;font-weight:650}
/* ---------- toolbar ---------- */
.bar{
  display:flex;gap:9px;align-items:center;padding:10px 22px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;
}
#q{
  flex:1;min-width:190px;background:var(--bg);border:1px solid var(--line);color:var(--fg);
  padding:7px 12px;border-radius:7px;font-size:13.5px;outline:none;font-family:inherit;
}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,111,237,.16)}
#q::placeholder{color:var(--fg3)}
.btn{
  background:var(--bg3);border:1px solid var(--line);color:var(--fg2);
  padding:7px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;
  font-family:inherit;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#232b3a;color:var(--fg);border-color:#3a4456}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
#tree{
  width:355px;flex:none;overflow-y:auto;padding:12px 10px 40px;
  border-right:1px solid var(--line);background:var(--bg2);
}
#detail{flex:1;overflow-y:auto;padding:26px 34px 60px}
#tree::-webkit-scrollbar,#detail::-webkit-scrollbar{width:9px}
#tree::-webkit-scrollbar-thumb,#detail::-webkit-scrollbar-thumb{background:#2c3444;border-radius:5px}
#tree::-webkit-scrollbar-track,#detail::-webkit-scrollbar-track{background:transparent}
/* ---------- tree ---------- */
.nd{user-select:none}
.row{
  display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:6px;
  cursor:pointer;font-size:13.5px;line-height:1.5;transition:.1s;
}
.row:hover{background:#212838}
.row.sel{background:rgba(47,111,237,.19);box-shadow:inset 2px 0 0 var(--acc)}
.row.hit{background:rgba(217,163,0,.15)}
.arw{
  width:14px;flex:none;color:var(--fg3);font-size:9px;text-align:center;
  transition:transform .16s;margin-top:5px;
}
.arw.op{transform:rotate(90deg)}
.arw.leaf{opacity:0}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:8px}
.nm{flex:1;word-break:break-word}
.nm.pend{color:var(--fg3);font-style:italic}
.cnt2{font-size:10.5px;color:var(--fg3);background:var(--bg);border:1px solid var(--line);
      border-radius:9px;padding:0 6px;margin-top:3px;flex:none}
.kids{margin-left:15px;border-left:1px dashed #2b3342;padding-left:7px;display:none}
.kids.op{display:block}
.top{margin-bottom:3px}
.top>.row{font-size:14.5px;font-weight:600}
/* ---------- detail ---------- */
.ph{color:var(--fg3);text-align:center;margin-top:90px;font-size:14px;line-height:2.1}
.ph .big{font-size:40px;display:block;margin-bottom:12px;opacity:.55}
.crumb{font-size:12px;color:var(--fg3);margin-bottom:9px}
.crumb span{color:var(--acc)}
h2.dt{font-size:22px;font-weight:700;margin-bottom:5px;line-height:1.4}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid;font-weight:600}
.t-概念{color:#5aa9ff;border-color:#25507d;background:rgba(47,111,237,.13)}
.t-公式{color:#b39bff;border-color:#4b3d8f;background:rgba(124,92,255,.13)}
.t-方法{color:#3ddb9b;border-color:#1d6b4f;background:rgba(0,168,107,.13)}
.t-易错{color:#ff7b7f;border-color:#7d2b2e;background:rgba(229,72,77,.13)}
.t-概念0{color:#5aa9ff;border-color:#25507d;background:rgba(47,111,237,.13)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:15px 18px;margin-bottom:13px}
.card h3{font-size:11.5px;font-weight:700;letter-spacing:1.3px;margin-bottom:9px;text-transform:uppercase}
.c-d h3{color:#5aa9ff} .c-f h3{color:#b39bff} .c-w h3{color:#ff7b7f}
.c-d,.c-f{font-size:14.5px;line-height:1.85;color:#dbe4ee}
.c-d b,.c-f b{color:#fff;font-weight:650}
.c-d u{text-decoration-color:#5aa9ff;text-underline-offset:2px}
.c-w{font-size:14px;line-height:1.8;color:#ffd0d1}
.c-w b{color:#ff9a9d}
.fml{
  font-family:"Cambria Math","Latin Modern Math","STIX Two Math",Georgia,"Times New Roman",serif;
  font-size:16.5px;line-height:2.15;background:var(--bg);border:1px solid var(--line);
  border-left:3px solid var(--pur);border-radius:8px;padding:13px 17px;color:#e8e2ff;
  overflow-x:auto;
}
.fml br{line-height:2.15}
.fml sub{font-size:.68em} .fml sup{font-size:.68em}
.src{
  font-size:12.5px;color:var(--fg2);display:flex;align-items:center;gap:8px;
  padding:9px 14px;background:rgba(0,168,107,.07);border:1px solid rgba(0,168,107,.25);
  border-radius:8px;margin-top:3px;
}
.src .ic{color:var(--grn);font-weight:700}
.pill{
  display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:20px;
  background:rgba(217,163,0,.14);border:1px solid rgba(217,163,0,.4);color:#f0c33c;font-weight:600;
}
.note{
  background:linear-gradient(96deg,rgba(47,111,237,.11),rgba(124,92,255,.07));
  border:1px solid rgba(47,111,237,.26);border-radius:9px;padding:11px 16px;
  font-size:13.5px;color:#b9c7db;margin-bottom:15px;
}
.note b{color:#8fb8ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px;margin-bottom:16px}
.gc{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13.5px}
.gc .gn{font-weight:650;margin-bottom:5px}
.gc .gd{font-size:12.5px;color:var(--fg2);line-height:1.65}
.gc .gd.pend{color:var(--fg3);font-style:italic}
.nomatch{padding:30px 8px;color:var(--fg3);font-size:13px;text-align:center}
@media(max-width:820px){
  main{flex-direction:column}
  #tree{width:100%;height:46%;border-right:none;border-bottom:1px solid var(--line)}
  #detail{padding:18px}
}
</style>
</head>

.pdf · 19 页", "st": "done"}, {"n": "汇交力系的简化", "t": "公式", "f": "<b>几何法<\/b>（力多边形法）：合力为力多边形的<b>封闭边<\/b>，作用线过汇交点<br><b>解析法<\/b>：F<sub>R<\/sub> = ΣF<sub>i<\/sub>，分量 F<sub>Rx<\/sub>=ΣF<sub>ix<\/sub>，F<sub>Ry<\/sub>=ΣF<sub>iy<\/sub>，F<sub>Rz<\/sub>=ΣF<sub>iz<\/sub><br><b>合力投影定理<\/b>：合力在某轴的投影 = 各分力在同一轴投影的代数和", "s": "1.2.2特殊力系的简化.pdf · 19 页", "st": "done"}, {"n": "合力矩定理（伐里农定理）", "t": "公式", "d": "用途：求合力作用线位置、求分布力合力作用点。", "f": "M<sub>O<\/sub>(F<sub>R<\/sub>) = Σ M<sub>O<\/sub>(F<sub>i<\/sub>)　即　r × ΣF<sub>i<\/sub> = Σ (r × F<sub>i<\/sub>)", "s": "1.2.2特殊力系的简化.pdf · 19 页", "st": "done"}, {"n": "力偶系的简化", "t": "公式", "f": "M = M<sub>1<\/sub> + M<sub>2<\/sub> + … + M<sub>n<\/sub> = ΣM<sub>i<\/sub>（矢量和）<br>平面力偶系退化为<b>代数和<\/b>", "s": "1.2.2特殊力系的简化.pdf · 19 页", "st": "done"}, {"n": "平行力系的简化", "t": "公式", "d": "两同向平行力 → 合力 F<sub>R<\/sub> = F<sub>1<\/sub> + F<sub>2<\/sub>，内分作用线<br>两反向平行力 → 合力 F<sub>R<\/sub> = F<sub>1<\/sub> − F<sub>2<\/sub>，<b>外分<\/b>作用线", "w": "<b>反向等值<\/b>平行力 = 力偶，<b>无合力<\/b>，中心位置无法确定。", "s": "1.2.2特殊力系的简化.pdf · 19 页", "st": "done"}, {"n": "分布载荷的合力", "t": "公式", "d": "<b>三条结论<\/b>：① 合力大小 = 载荷图<b>面积<\/b>；② 方向与载荷同向；③ 作用线过载荷图<b>形心<\/b>。", "f": "大小：Q = ∫<sub>0<\/sub><sup>l<\/sup> q(x)dx<br>作用点：由合力矩定理 x<sub>C<\/sub> = ∫x·q(x)dx / ∫q(x)dx", "s": "1.2.2特殊力系的简化.pdf · 19 页", "st": "done"}, {"n": "平行力系中心 · 重心", "t": "公式", "f": "矢量式：r<sub>C<\/sub> = Σ(F<sub>i<\/sub>r<sub>i<\/sub>) / ΣF<sub>i<\/sub><br>积分式（重心）：x<sub>C<\/sub> = ∫x·ρg dV / ∫ρg dV<br>均质物体：<b>重心与形心重合<\/b>", "s": "1.2.2特殊力系的简化.pdf · 19 页", "st": "done"}], "note": "几何法（图）与解析法（代数式）两条路要都会"}, {"n": "1.2.3 力的平移定理", "st": "done", "c": [{"n": "力的平移定理", "t": "公式", "d": "过程<b>可逆<\/b>：一个力 + 一个力偶可合成为一个平行移动的力。", "f": "作用于刚体上任一点的力，可平行移到刚体内任一指定点，但必须<b>附加一力偶<\/b>，其力偶矩 = 原力对新作用点之矩：<br>M<sub>B<\/sub> = M<sub>B<\/sub>(F)", "s": "1.2.3力的平移定理.pdf · 6 页", "st": "done"}, {"n": "力 + 力偶 → 合力", "t": "公式", "f": "作用在<b>同一平面内<\/b>的力 F 与力偶 M 可合成为一个合力，合力作用线偏移 d = M / F", "w": "空间情形下力与力偶一般不能合成为一个力（见力螺旋）。", "s": "1.2.3力的平移定理.pdf · 6 页", "st": "done"}], "note": "把「力」拆成「力 + 力偶」是力系简化的核心工具"}, {"n": "1.2.4 空间任意力系的简化", "st": "done", "c": [{"n": "主矢与主矩", "t": "公式", "f": "主矢 F<sub>R<\/sub>′ = ΣF<sub>i<\/sub>（力系中各力的矢量和）<br>主矩 M<sub>O<\/sub> = ΣM<sub>O<\/sub>(F<sub>i<\/sub>)（各力对简化中心之矩的矢量和）", "w": "<b>主矢与简化中心选择无关<\/b>（自由矢量）；<b>主矩与简化中心有关<\/b>。<br>主矢 ≠ 合力：合力有确定作用线，主矢只是矢量和。", "s": "1.2.4空间任意力系的简化.pdf · 16 页", "st": "done"}, {"n": "主矩的传递公式", "t": "公式", "f": "M<sub>A<\/sub> = M<sub>O<\/sub> + r<sub>OA<\/sub> × F<sub>R<\/sub>′", "s": "1.2.4空间任意力系的简化.pdf · 16 页", "st": "done"}, {"n": "简化结果四种情形", "t": "公式", "f": "① F<sub>R<\/sub>′ = 0，M<sub>O<\/sub> = 0　→　<b>平衡<\/b><br>② F<sub>R<\/sub>′ ≠ 0，M<sub>O<\/sub> = 0　→　<b>合力<\/b>（过简化中心）<br>③ F<sub>R<\/sub>′ = 0，M<sub>O<\/sub> ≠ 0　→　<b>合力偶<\/b>（与简化中心无关）<br>④ F<sub>R<\/sub>′ ≠ 0，M<sub>O<\/sub> ≠ 0：<br>　　· F<sub>R<\/sub>′ · M<sub>O<\/sub> = 0　→　<b>合力<\/b>（偏移 d = M<sub>O<\/sub>/F<sub>R<\/sub>′）<br>　　· F<sub>R<\/sub>′ · M<sub>O<\/sub> ≠ 0　→　<b>力螺旋<\/b>", "w": "空间力系最终结果可能是：平衡 / 合力 / 合力偶 / <b>力螺旋<\/b>（四种）<br>平面力系只可能是：平衡 / 合力 / 合力偶（三种）——平面问题<b>绝无<\/b>力螺旋。", "s": "1.2.4空间任意力系的简化.pdf · 16 页", "st": "done"}, {"n": "力螺旋", "t": "概念", "d": "一个力 + 一个作用面与力<b>垂直<\/b>的力偶的组合。力的作用线称<b>力螺旋中心轴<\/b>。<br>力矢与力偶矩同向 → <b>右手螺旋<\/b>；反向 → <b>左手螺旋<\/b>。<br>工程实例：拧螺丝、空气阻力形成的螺旋。", "s": "1.2.4空间任意力系的简化.pdf · 16 页", "st": "done"}], "note": "主矢 / 主矩 是判断一切力系最终归宿的判据"}], "note": "从力、力偶两个基本元素出发，逐级搭建到空间任意力系", "color": "#7c5cff"}, {"n": "1-3 约束与受力分析", "st": "done", "c": [{"n": "四组前提概念", "t": "概念", "d": "<b>自由体<\/b>：空间位置或位移不受限制<br><b>非自由体<\/b>：位置或位移受到限制<br><b>约束<\/b>：限制物体位移或速度的物体或条件<br><b>主动力<\/b>：促使物体运动或有运动趋势的力（工程上称载荷）<br><b>约束力<\/b>：约束作用于被约束体的力", "s": "1.3.1常见约束及其约束力.pdf · 21 页", "st": "done"}, {"n": "约束力的两条特点", "t": "概念", "d": "① 大小与方向与<b>主动力<\/b>有关（由平衡方程定）<br>② 方向与该约束<b>所能阻碍的位移方向相反<\/b>（由约束性质定）", "s": "1.3.1常见约束及其约束力.pdf · 21 页", "st": "done"}, {"n": "八类常见约束 · 约束力", "t": "公式", "f": "<b>1 柔索<\/b>：沿索方向的<b>拉力<\/b>，单侧约束<br><b>2 光滑接触面<\/b>：过接触点沿<b>公法线<\/b>，指向被约束物体，单侧<br><b>3 光滑圆柱铰链<\/b>（固定铰支座）：垂直销轴的平面内，方位未知 → 两个正交分力 F<sub>x<\/sub>、F<sub>y<\/sub><br><b>4 辊轴支座<\/b>（可动铰）：沿支承面<b>法线<\/b>一个力<br><b>5 球铰链<\/b>：过球心、方向未知 → 三个正交分力 F<sub>x<\/sub>、F<sub>y<\/sub>、F<sub>z<\/sub><br><b>6 颈轴承<\/b>：2 个径向分力；<b>止推轴承<\/b>：2 径向 + 1 轴向<br><b>7 二力杆（链杆）<\/b>：沿两铰中心连线，等值反向<br><b>8 固定端<\/b>：约束力 + <b>约束力偶<\/b>（平面 3 个，空间 6 个）", "w": "光滑接触面与柔索都是<b>单侧约束<\/b>（只能推不能拉），若算出负的接触压力说明该处实际已脱离接触。", "s": "1.3.1常见约束及其约束力.pdf · 21 页", "st": "done"}, {"n": "画受力图四步", "t": "方法", "d": "① 选定研究对象，<b>取隔离体<\/b><br>② 画全部<b>主动力、主动力偶<\/b><br>③ 在每一约束处画全部<b>约束力<\/b><br>④ 检查：不漏画、不多画，严格遵守作用与反作用公理", "w": "<b>二力杆的识别<\/b>与<b>三力平衡汇交定理<\/b>能大幅简化受力分析。<br>同一系统各隔离体受力图必须<b>整体与局部一致、相互协调<\/b>。", "s": "1.3.2受力分析.pdf · 12 页", "st": "done"}, {"n": "结构计算简图", "t": "方法", "d": "实际结构 → 计算简图需考虑四类简化：<br>① <b>构件<\/b>简化　② <b>支座（约束）<\/b>简化　③ <b>荷载<\/b>简化　④ <b>结点<\/b>简化<br>结点分：铰结点 / 刚结点 / 组合结点", "s": "1.3.2受力分析.pdf · 12 页", "st": "done"}], "note": "受力分析错，后面全错——这是静力学第一生命线", "color": "#7c5cff"}, {"n": "1-4 力系的平衡", "st": "done", "c": [{"n": "平衡的充要条件", "t": "公式", "f": "力系的<b>主矢<\/b>与对<b>任一点<\/b>的<b>主矩<\/b>均等于零矢量：<br>F<sub>R<\/sub>′ = 0　且　M<sub>O<\/sub> = 0", "s": "1.4.1平面力系的平衡方程.pdf · 13 页", "st": "done"}, {"n": "平面力系平衡方程三形式", "t": "公式", "f": "<b>基本形式<\/b>：ΣF<sub>x<\/sub> = 0，ΣF<sub>y<\/sub> = 0，ΣM<sub>O<\/sub>(F) = 0<br><b>二矩式<\/b>：ΣF<sub>x<\/sub> = 0，ΣM<sub>A<\/sub> = 0，ΣM<sub>B<\/sub> = 0　（x 轴<b>不得垂直<\/b>于 AB 连线）<br><b>三矩式<\/b>：ΣM<sub>A<\/sub> = 0，ΣM<sub>B<\/sub> = 0，ΣM<sub>C<\/sub> = 0　（A、B、C <b>不得共线<\/b>）", "w": "附加条件一旦违背，三个方程就不独立，解是假的。", "s": "1.4.1平面力系的平衡方程.pdf · 13 页", "st": "done"}, {"n": "三种特殊平面力系", "t": "公式", "f": "<b>平面汇交力系<\/b>：ΣF<sub>x<\/sub> = 0，ΣF<sub>y<\/sub> = 0（2 个，解 2 个未知量）<br><b>平面平行力系<\/b>：ΣF<sub>y<\/sub> = 0，ΣM<sub>O<\/sub> = 0（2 个）<br><b>平面力偶系<\/b>：ΣM = 0（1 个）", "s": "1.4.1平面力系的平衡方程.pdf · 13 页", "st": "done"}, {"n": "空间力系平衡方程", "t": "公式", "d": "空间汇交力系 3 个；空间平行力系 3 个；空间力偶系 3 个。", "f": "ΣF<sub>x<\/sub> = 0，ΣF<sub>y<\/sub> = 0，ΣF<sub>z<\/sub> = 0<br>ΣM<sub>x<\/sub> = 0，ΣM<sub>y<\/sub> = 0，ΣM<sub>z<\/sub> = 0<br>共 <b>6 个独立方程<\/b>，可解 6 个未知量", "s": "1.4.2空间力系.pdf · 9 页", "st": "done"}, {"n": "刚体系统的平衡", "t": "方法", "d": "<b>外力<\/b>：系统以外物体作用于系统的力；<b>内力<\/b>：系统内部各刚体间的相互作用力<br>系统平衡 ⇔ <b>每一个<\/b>刚体都平衡<br>两条路线：<b>整体法<\/b>（先整体后局部）/ <b>逐段分离法<\/b>（依次取单体）", "w": "取整体为研究对象时，<b>内力成对抵消、不出现<\/b>，因此求不出内力；要求内力必须切开取分离体。", "s": "1.4.3刚体系的平衡问题.pdf · 16 页", "st": "done"}, {"n": "静定与静不定", "t": "公式", "f": "<b>静定<\/b>：未知量个数 = 独立平衡方程个数<br><b>静不定<\/b>：未知量个数 &gt; 独立方程个数<br><b>静不定次数 = 未知量个数 − 独立方程个数<\/b>", "w": "判定次序：正确受力分析 → 判断<b>力系类型<\/b> → 确定<b>独立方程个数<\/b>。<br>静不定问题并非全无解：仍可能求出<b>部分<\/b>未知量；要求全部需补充<b>变形协调方程<\/b>（属材料力学）。<br>静不定未必是坏事——工程上常靠它提高结构强度与刚度。", "s": "1.4.3刚体系的平衡问题.pdf · 16 页", "st": "done"}, {"n": "平面桁架 · 理想化假设", "t": "概念", "d": "① 节点抽象为<b>光滑铰链<\/b>　② 杆件自重不计或均分到两端节点　③ 载荷沿桁架平面作用于<b>节点<\/b>上<br>⇒ 桁架中<b>每根杆都是二力杆<\/b>，内力沿杆轴线", "s": "1.4.4平面桁架内力计算.pdf · 16 页", "st": "done"}, {"n": "平面简单桁架判别式", "t": "公式", "d": "以基本三角形为基础，每增加一个节点需增加两根轴线不平行的杆。", "f": "m = 2n − 3　　（m = 杆件数，n = 节点数）", "s": "1.4.4平面桁架内力计算.pdf · 16 页", "st": "done"}, {"n": "节点法 / 截面法", "t": "方法", "d": "<b>节点法<\/b>：逐个取节点为研究对象，列平衡方程求杆内力（适合求全部杆）<br><b>截面法<\/b>：假想截开桁架，取任一部分，列 3 个方程求<b>被切杆<\/b>内力（适合求指定杆）", "w": "截面法一次最多切 3 根未知杆（平面 3 个独立方程）。", "s": "1.4.4平面桁架内力计算.pdf · 16 页", "st": "done"}, {"n": "零杆判定", "t": "公式", "d": "<b>情形1<\/b>　节点只连两杆、节点上无主动力、两杆不平行 ⇒ <b>两杆均为零杆<\/b><br><b>情形2<\/b>　节点连三杆、节点上无主动力、其中两杆平行 ⇒ <b>第三杆为零杆<\/b>", "w": "先判零杆可大幅减少计算量，是桁架题的提速关键。", "s": "1.4.4平面桁架内力计算.pdf · 16 页", "st": "done"}], "note": "平面 3 个方程 / 空间 6 个方程 —— 解题的「弹药总量」", "color": "#7c5cff"}, {"n": "1-5 考虑摩擦的平衡", "st": "done", "c": [{"n": "滑动摩擦力", "t": "公式", "f": "<b>静摩擦力<\/b>：F<sub>s<\/sub> ≤ F<sub>max<\/sub>，方向与<b>相对滑动趋势<\/b>相反<br><b>最大静摩擦力<\/b>（库仑定律）：F<sub>max<\/sub> = μ F<sub>N<\/sub><br><b>动摩擦力<\/b>：F<sub>d<\/sub> = f·F<sub>N<\/sub>，方向与<b>相对滑动方向<\/b>相反", "w": "静摩擦力方向<b>由平衡方程决定，可以假设<\/b>（算负即假设反了）；临界状态摩擦力方向<b>必须与真实运动趋势一致，不可任意假设<\/b>。", "s": "1.4.5摩擦与自锁.pdf · 23 页", "st": "done"}, {"n": "摩擦角", "t": "公式", "d": "摩擦角是<b>静摩擦力取值范围的几何表示<\/b>；三维情形下推广为<b>摩擦锥<\/b>（以法线为轴、顶角 2φ 的正圆锥）。", "f": "全反力 F<sub>R<\/sub> = F<sub>N<\/sub> + F<sub>f<\/sub>，与法线夹角的最大值称<b>摩擦角<\/b> φ<br>tan φ = F<sub>max<\/sub> / F<sub>N<\/sub> = μ", "s": "1.4.5摩擦与自锁.pdf · 23 页", "st": "done"}, {"n": "摩擦自锁", "t": "公式", "d": "只要主动力合力在摩擦锥内，<b>无论其大小如何变化<\/b>，物体始终保持平衡。<br>工程应用：螺旋千斤顶、利用摩擦角测静摩擦因数、沙堆自然休止角。", "f": "<b>自锁条件<\/b>：主动力合力作用线落在<b>摩擦锥之内<\/b>（α ≤ φ）", "s": "1.4.5摩擦与自锁.pdf · 23 页", "st": "done"}, {"n": "滚动摩阻", "t": "公式", "d": "δ 称<b>滚阻系数<\/b>，具有<b>长度量纲<\/b>（这是与 μ 最本质的区别）。", "f": "0 ≤ M<sub>f<\/sub> ≤ M<sub>max<\/sub>，　M<sub>max<\/sub> = δ·F<sub>N<\/sub>", "w": "滚动摩阻是<b>力偶<\/b>不是力。圆轮「∑F≠0 却仍平衡」的矛盾，正是靠滚动摩阻力偶解决的。", "s": "1.4.5摩擦与自锁.pdf · 23 页", "st": "done"}, {"n": "两类摩擦平衡问题", "t": "方法", "f": "<b>① 判断是否平衡、求摩擦力<\/b>（<u>非临界<\/u>）：未知量数 = 独立方程数，摩擦力相当于「<b>有上限的约束反力<\/b>」，算出后需验证 F<sub>s<\/sub> ≤ μF<sub>N<\/sub><br><b>② 确定平衡范围<\/b>（<u>临界<\/u>）：未知量数 &gt; 独立方程数，补 F<sub>max<\/sub> = μF<sub>N<\/sub>，结果是一个<b>范围<\/b>", "w": "含摩擦的问题<b>结果常常是区间而非定值<\/b>，这是它与无摩擦题最大的不同。", "s": "1.4.6考虑摩擦的平衡问题.pdf · 12 页", "st": "done"}, {"n": "多点摩擦 · 穷举法", "t": "方法", "d": "未知量数 &gt; 方程数时：<br>① 先判断<b>哪个点先达到临界<\/b>（比较所需的 F 或力矩）<br>② 若难判断则<b>穷举<\/b>：对所有可能的运动形式（滑动方向、滑动 vs 翻倒、单点临界 vs 多点同时临界）逐一假设求解再取交集", "s": "1.4.6考虑摩擦的平衡问题.pdf · 12 页", "st": "done"}, {"n": "皮带摩擦 · 欧拉公式", "t": "公式", "d": "推导关键：取微段，dN = T·dθ，dT = μ·dN ⇒ dT/T = μ·dθ，两边积分。<br>应用：缆绳绕桩（绕两圈、μ=0.5 时，500 N 可平衡约 2670 N）。", "f": "T<sub>2<\/sub> = T<sub>1<\/sub>·e<sup>μβ<\/sup>　（临界状态，β 为包角，单位 rad）", "w": "β 必须用<b>弧度<\/b>；公式给出的是<b>临界上限<\/b>，实际不打滑条件为 T<sub>2<\/sub> ≤ T<sub>1<\/sub>e<sup>μβ<\/sup>。", "s": "1.4.6考虑摩擦的平衡问题.pdf · 12 页", "st": "done"}], "note": "摩擦把「等式求解」变成「不等式判定」，是静力学最难的一类", "color": "#7c5cff"}], "note": "全课程篇幅最大的一章，13 份讲义、约 190 页", "color": "#2f6fed"}, {"n": "第2章 运动学基础", "st": "done", "c": [{"n": "2-1 点的运动", "st": "done", "c": [{"n": "三种描述方法", "t": "方法", "d": "<b>① 矢径法<\/b>：r = r(t)<br><b>② 直角坐标法<\/b>：x = f<sub>1<\/sub>(t)，y = f<sub>2<\/sub>(t)，z = f<sub>3<\/sub>(t)<br><b>③ 自然坐标法<\/b>：s = s(t)（<u>已知轨迹时<\/u>最方便）", "w": "运动方程中消去时间参数 t 即得<b>轨迹方程<\/b>。", "s": "2.1运动学基础-点的运动.pdf · 17 页", "st": "done"}, {"n": "速度与加速度", "t": "公式", "f": "v = dr/dt　方向沿轨迹<b>切线<\/b>，指向运动方向<br>a = dv/dt = d²r/dt²<br>直角坐标分量：v = ẋi + ẏj + żk，a = ẍi + ÿj + z̈k", "s": "2.1运动学基础-点的运动.pdf · 17 页", "st": "done"}, {"n": "自然轴系", "t": "概念", "d": "<b>τ<\/b> 切向单位矢量　<b>n<\/b> 主法线单位矢量　<b>b<\/b> = τ × n 副法线单位矢量<br>由 τ、n 张成的极限平面称<b>密切面<\/b>", "s": "2.1运动学基础-点的运动.pdf · 17 页", "st": "done"}, {"n": "切向 / 法向加速度", "t": "公式", "f": "a = a<sub>τ<\/sub>·τ + a<sub>n<\/sub>·n<br>a<sub>τ<\/sub> = dv/dt（反映速度<b>大小<\/b>的变化率）<br>a<sub>n<\/sub> = v²/ρ（反映速度<b>方向<\/b>的变化率，ρ 为曲率半径）<br>总大小 a = √(a<sub>τ<\/sub>² + a<sub>n<\/sub>²)", "w": "a<sub>τ<\/sub> 是 v 的<b>标量<\/b>导数（不是 |v| 的导数再取绝对值）；匀速曲线运动 a<sub>τ<\/sub> = 0 但 a<sub>n<\/sub> ≠ 0，<b>加速度不为零<\/b>。", "s": "2.1运动学基础-点的运动.pdf · 17 页", "st": "done"}, {"n": "曲率与曲率半径", "t": "公式", "f": "k = lim<sub>Δs→0<\/sub> Δθ/Δs = 1/ρ", "s": "2.1运动学基础-点的运动.pdf · 17 页", "st": "done"}], "note": "点的运动是刚体运动的基础", "color": "#7c5cff"}, {"n": "2-2 刚体的基本运动", "st": "done", "c": [{"n": "平动", "t": "公式", "d": "刚体内任一直线在运动中始终与初始位置平行。<br>⇒ 各点轨迹形状相同，<b>速度、加速度也相同<\/b>；r<sub>BA<\/sub> 为常矢量。", "w": "结论：<b>研究平动刚体 = 研究一个点<\/b>。<br>分<b>直线平动<\/b>与<b>曲线平动<\/b>——曲线平动时轨迹仍可是曲线。", "s": "2.2运动学基础-刚体的运动.pdf · 14 页", "st": "done"}, {"n": "定轴转动的运动量", "t": "公式", "f": "转动方程 φ = φ(t)<br>角速度 ω = dφ/dt (rad/s)　　角加速度 α = dω/dt = d²φ/dt² (rad/s²)<br>转速换算：ω = 2πn/60　（n 单位 r/min）", "s": "2.2运动学基础-刚体的运动.pdf · 14 页", "st": "done"}, {"n": "转动刚体上点的速度 / 加速度", "t": "公式", "d": "轴线上各点静止，其余各点均作<b>圆周运动<\/b>。", "f": "s = R·φ，　v = ωR，　a<sub>τ<\/sub> = αR，　a<sub>n<\/sub> = ω²R<br>全加速度大小 a = R√(α² + ω⁴)，偏角 tan θ = a<sub>τ<\/sub>/a<sub>n<\/sub> = α/ω²", "s": "2.2运动学基础-刚体的运动.pdf · 14 页", "st": "done"}, {"n": "矢量表示与泊松公式", "t": "公式", "d": "泊松公式 = 动坐标系单位矢量对时间的导数公式，是推导<b>科氏加速度<\/b>的数学根源。", "f": "v = ω × r<br><b>泊松公式<\/b>：di′/dt = ω × i′，dj′/dt = ω × j′，dk′/dt = ω × k′", "s": "2.2运动学基础-刚体的运动.pdf · 14 页", "st": "done"}, {"n": "传动比", "t": "公式", "f": "齿轮（无滑动）：i<sub>12<\/sub> = ω<sub>1<\/sub>/ω<sub>2<\/sub> = R<sub>2<\/sub>/R<sub>1<\/sub> = z<sub>2<\/sub const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 构建树 ---------- */
const tree = $('#tree');
let uid = 0;
let FLAT = [];          // {node, el, row, parentId, depth}
let mode = 'all';       // all | done | pending
let query = '';

function build(node, host, depth, parentId, chain){
  const id = ++uid;
  const isBranch = Array.isArray(node.c);
  const wrap = document.createElement('div');
  wrap.className = 'nd' + (depth === 1 ? ' top' : '');

  const row = document.createElement('div');
  row.className = 'row';
  const col = node.color || (node.st === 'pending' ? '#6e7d92' : (isBranch ? '#8fa3bf' : '#4a9eff'));

  let arw = '<div class="arw' + (isBranch ? '' : ' leaf') + '">▶</div>';
  let cntBadge = isBranch ? '<div class="cnt2">' + countLeaves(node) + '</div>' : '';
  row.innerHTML = arw
    + '<div class="dot" style="background:' + col + '"></div>'
    + '<div class="nm' + (node.st === 'pending' ? ' pend' : '') + '">' + esc(node.n) + '</div>'
    + cntBadge;
  wrap.appendChild(row);

  const kids = document.createElement('div');
  kids.className = 'kids';
  if (isBranch){
    const ch = chain.concat([node.n]);
    node.c.forEach(k => build(k, kids, depth + 1, id, ch));
    wrap.appendChild(kids);
  }
  host.appendChild(wrap);

  FLAT.push({node, el: wrap, row, kids, parentId, depth, chain, id, isBranch});

  row.onclick = e => {
    e.stopPropagation();
    if (isBranch){
      kids.classList.toggle('op');
      row.querySelector('.arw').classList.toggle('op');
    }
    document.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel'));
    row.classList.add('sel');
    render(node, chain);
  };
  return id;
}

function countLeaves(n){
  if (!Array.isArray(n.c)) return 0;
  let t = 0;
  n.c.forEach(k => { t += Array.isArray(k.c) ? countLeaves(k) : 1; });
  return t;
}

function lineageOf(targetId){
  const byId = {};
  FLAT.forEach(f => byId[f.id] = f);
  const out = [];
  let cur = byId[targetId];
  while (cur){ out.unshift(cur); cur = byId[cur.parentId]; }
  return out;
}
function openAncestors(targetId){
  lineageOf(targetId).forEach(f => {
    if (f.isBranch){
      f.kids.classList.add('op');
      const a = f.row.querySelector('.arw');
      if (a) a.classList.add('op');
    }
  });
}

/* ---------- 详情面板 ---------- */
function render(n, chain){
  const d = $('#detail');
  if (Array.isArray(n.c)){
    const kids = n.c;
    const cards = kids.map(k => {
      const t = k.t ? '<span class="tag t-' + k.t + '">' + k.t + '</span>' : '';
      const dd = k.d ? '<div class="gd' + (k.st === 'pending' ? ' pend' : '') + '">' + k.d + '</div>'
                     : '<div class="gd pend">共 ' + countLeaves(k) + ' 个知识点</div>';
      return '<div class="gc"><div class="gn">' + esc(k.n) + ' ' + t + '</div>' + dd + '</div>';
    }).join('');
    d.innerHTML =
      '<div class="crumb">' + chain.concat([n.n]).map(x => '<span>' + esc(x) + '</span>').join(' › ') + '</div>'
      + '<h2 class="dt">' + esc(n.n) + '</h2>'
      + (n.st === 'pending' ? '<div style="margin:12px 0 4px"><span class="pill">📅 讲义尚未发布 · 按课程大纲预告</span></div>' : '')
      + (n.note ? '<div class="note">💡 ' + n.note + '</div>' : '')
      + '<div class="grid">' + cards + '</div>';
    return;
  }
  let h = '<div class="crumb">' + chain.map(x => '<span>' + esc(x) + '</span>').join(' › ') + '</div>'
        + '<h2 class="dt">' + esc(n.n) + '</h2>';
  const tags = [];
  if (n.t) tags.push('<span class="tag t-' + n.t + '">' + n.t + '</span>');
  if (n.st === 'pending') tags.push('<span class="pill">📅 待发布</span>');
  if (tags.length) h += '<div class="tags">' + tags.join('') + '</div>';
  if (n.d) h += '<div class="card c-d"><h3>要点</h3>' + n.d + '</div>';
  if (n.f) h += '<div class="card c-f"><h3>公式</h3><div class="fml">' + n.f + '</div></div>';
  if (n.w) h += '<div class="card c-w"><h3>⚠ 易错点</h3>' + n.w + '</div>';
  if (n.s) h += '<div class="src"><span class="ic">📄</span> 出处：' + esc(n.s) + '</div>';
  d.innerHTML = h;
  d.scrollTop = 0;
}

/* ---------- 过滤 / 搜索 ---------- */
function modeOK(n){
  if (mode === 'done')    return n.st !== 'pending';
  if (mode === 'pending') return n.st === 'pending';
  return true;
}
function matches(n){
  if (!modeOK(n)) return false;
  if (!query) return true;
  const blob = (n.n + ' ' + (n.d || '') + ' ' + (n.f || '') + ' ' + (n.w || '') + ' ' + (n.s || '')).toLowerCase();
  return blob.indexOf(query) >= 0;
}
function apply(){
  const selfM = new Map(), subM = new Map(), vis = new Map();
  FLAT.forEach(f => selfM.set(f.id, matches(f.node)));

  // 自底向上：自身命中 或 任一后代命中
  function sub(id){
    if (subM.has(id)) return subM.get(id);
    let v = selfM.get(id);
    FLAT.filter(g => g.parentId === id).forEach(g => { if (sub(g.id)) v = true; });
    subM.set(id, v); return v;
  }
  FLAT.forEach(f => sub(f.id));

  // 自顶向下：祖先命中 → 后代一并显示
  function v(id, parentVisible){
    const val = subM.get(id) || parentVisible;
    vis.set(id, val);
    FLAT.filter(g => g.parentId === id).forEach(g => v(g.id, val));
  }
  FLAT.filter(f => f.parentId === 0).forEach(f => v(f.id, false));

  FLAT.forEach(f => {
    f.el.style.display = vis.get(f.id) ? '' : 'none';
    f.row.classList.toggle('hit', !!query && selfM.get(f.id) && !f.isBranch);
  });

  if (query) FLAT.filter(f => selfM.get(f.id)).forEach(f => openAncestors(f.id));

  const n = FLAT.filter(f => vis.get(f.id) && !f.isBranch).length;
  let t = $('#hitTip');
  if (query){
    if (!t){ t = document.createElement('div'); t.id = 'hitTip'; t.className = 'nomatch'; tree.insertBefore(t, tree.firstChild); }
    t.textContent = n ? '🔍 匹配到 ' + n + ' 个知识点' : '🔍 没有匹配的知识点';
  } else if (t) t.remove();
}

/* ---------- 事件 ---------- */
let timer;
$('#q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { query = e.target.value.trim().toLowerCase(); apply(); }, 140); };
function setMode(m){
  mode = m;
  $('#bAll').classList.toggle('on', m === 'all');
  $('#bDone').classList.toggle('on', m === 'done');
  $('#bPend').classList.toggle('on', m === 'pending');
  apply();
}
$('#bAll').onclick  = () => setMode('all');
$('#bDone').onclick = () => setMode('done');
$('#bPend').onclick = () => setMode('pending');
$('#bExp').onclick  = () => FLAT.forEach(f => { if (f.isBranch){ f.kids.classList.add('op'); const a = f.row.querySelector('.arw'); if (a) a.classList.add('op'); } });
$('#bCol').onclick  = () => FLAT.forEach(f => { if (f.isBranch && f.depth > 1){ f.kids.classList.remove('op'); const a = f.row.querySelector('.arw'); if (a) a.classList.remove('op'); } });

/* ---------- init ---------- */
DATA.c.forEach(k => build(k, tree, 1, 0, []));
// 默认展开第一层
FLAT.filter(f => f.depth === 1).forEach(f => { f.kids.classList.add('op'); const a = f.row.querySelector('.arw'); if (a) a.classList.add('op'); });
render(DATA, []);
</script>
</body>
